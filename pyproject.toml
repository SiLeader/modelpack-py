[project]
name = "modelpack-client"
version = "0.1.0"
description = "Python client for pushing and pulling CNCF ModelPack OCI artifacts"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "jsonschema>=4.18",
    "oras>=0.2.43,<0.3",
    "zstandard>=0.23",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3.16",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = []

[project.urls]
Homepage = "https://github.com/SiLeader/modelpack-py"
Issue = "https://github.com/SiLeader/modelpack-py/issues"

[project.scripts]
modelpack = "modelpack_client.__main__:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
